services:
  payload:
    image: node:24-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URI: postgresql://alrukn_app:local-development-only@postgres:5432/alrukn_furniture
      PAYLOAD_SECRET: local-development-only-replace-before-use
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alrukn_furniture
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_USER: alrukn_app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alrukn_app -d alrukn_furniture']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  node_modules:
  postgres_data:
